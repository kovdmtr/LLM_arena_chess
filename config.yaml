# LLM Chess Arena — несекретная конфигурация.
# Секреты (API-ключи) — только в .env (см. .env.example). Здесь хранятся имена
# переменных окружения (api_key_env), а не их значения.

arena:
  illegal_move_retries: 3        # попыток до технического поражения
  hints_per_player: 3
  auto_claim_draws: true         # авто-ничья при 50-ходовом/троекратном повторении
  include_legal_moves: false     # класть ли список легальных ходов в промпт; false —
                                 # модель ходит по FEN/PGN, легальность проверяется после хода (D-021)
  strategy:
    enabled: true                # фича «стратегия»: модель ведёт приватный rolling-план
                                 # (strategy/plan_status), план прошлого хода возвращается ей же
  response_language: null        # язык полей reasoning/strategy: "ru" | "en" | null (не навязывать);
                                 # веб подставляет сюда язык интерфейса при старте партии

engine:
  enabled: true
  path: "tools/bin/stockfish.exe"   # путь к бинарнику (относит. корня репо) или имя в PATH; нет файла → ★ деградируют (D-008)
  analysis_depth: 18
  hint_depth: 18

retry:                           # повтор вызова провайдера при временных сбоях (Phase 7)
  attempts: 3                    # всего попыток (1 = без повторов)
  base_delay: 0.5                # старт экспоненциального backoff, сек
  max_delay: 8.0                 # потолок задержки, сек
  multiplier: 2.0                # множитель backoff между попытками
  jitter: 0.1                    # доля размытия задержки [0..1], чтобы избежать синхронных повторов

analysis:                        # ★ пороги классификации ходов (centipawn loss, D-009)
  enabled: true
  good_cp: 20                   # cpl ≤ — хороший ход (!); выше и до неточности — просто ход
  inaccuracy_cp: 50             # cpl ≥ — неточность / сомнительный ход (?!)
  mistake_cp: 120               # cpl ≥ — ошибка (?)
  blunder_cp: 300               # cpl ≥ — зевок (??)
  brilliant_max_cpl: 10         # «блестящий» (!!)/«интересный» (!?): ход почти лучший (cpl ≤ этого) …
  brilliant_min_eval_cp: 100    # … + жертва: перевес ≥ этого → блестящий, в коридоре ±этого → интересный

providers:                       # имя провайдера = имя реализации (register_provider)
  openai:    { api_key_env: OPENAI_API_KEY }
  anthropic: { api_key_env: ANTHROPIC_API_KEY }
  gemini:    { api_key_env: GOOGLE_API_KEY }   # реализация зарегистрирована как 'gemini' (D-018)

models:                          # каталог выбираемых моделей
  # id — ключ каталога, model — имя в API (нужно, когда одна модель заведена
  # несколькими записями с разными параметрами: GPT с разной глубиной раздумья).
  - id: gpt-4o
    provider: openai
    display_name: "GPT-4o"
    params: { temperature: 0.2, max_tokens: 1024 }

  # GPT-5.5 в трёх режимах раздумья. Эта серия отвергает temperature (только 1)
  # и max_tokens (нужен max_completion_tokens) → params.reasoning: true.
  # Размышления тратят output-токены, поэтому лимит растёт вместе с глубиной.
  - id: gpt-5.5-instant
    model: gpt-5.5
    provider: openai
    display_name: "GPT-5.5 Instant"
    params: { temperature: null, max_tokens: 4096, reasoning: true, reasoning_effort: "none" }
  - id: gpt-5.5-medium
    model: gpt-5.5
    provider: openai
    display_name: "GPT-5.5 Medium"
    params: { temperature: null, max_tokens: 8192, reasoning: true, reasoning_effort: "medium" }
  - id: gpt-5.5-high
    model: gpt-5.5
    provider: openai
    display_name: "GPT-5.5 High"
    params: { temperature: null, max_tokens: 16384, reasoning: true, reasoning_effort: "high" }

  # Claude: у моделей 5-й серии и Opus 4.8 параметр temperature объявлен
  # устаревшим и отвергается с 400 → temperature: null. Haiku его ещё принимает.
  - id: claude-opus-5
    provider: anthropic
    display_name: "Claude Opus 5"
    params: { temperature: null, max_tokens: 2048 }
  - id: claude-sonnet-5
    provider: anthropic
    display_name: "Claude Sonnet 5"
    params: { temperature: null, max_tokens: 2048 }
  - id: claude-opus-4-8
    provider: anthropic
    display_name: "Claude Opus 4.8"
    params: { temperature: null, max_tokens: 1024 }
  - id: claude-haiku-4-5
    model: claude-haiku-4-5-20251001
    provider: anthropic
    display_name: "Claude Haiku 4.5"
    params: { temperature: 0.2, max_tokens: 1024 }

  # Gemini: «думающие» модели тратят output-токены на размышления. С малым
  # лимитом (1024) бюджет съедается мыслями, текст ответа пустой → партия рвётся,
  # поэтому у всех запас на размышления + ход. Flash дешевле и стабильнее pro.
  - id: gemini-2.5-pro
    provider: gemini
    display_name: "Gemini 2.5 Pro"
    params: { temperature: 0.2, max_tokens: 8192 }
  - id: gemini-3.6-flash
    provider: gemini
    display_name: "Gemini 3.6 Flash"
    params: { temperature: 0.2, max_tokens: 8192 }
  - id: gemini-3.5-flash
    provider: gemini
    display_name: "Gemini 3.5 Flash"
    params: { temperature: 0.2, max_tokens: 8192 }
  - id: gemini-3-flash-preview
    provider: gemini
    display_name: "Gemini 3 Flash"
    params: { temperature: 0.2, max_tokens: 8192 }
  - id: gemini-3.5-flash-lite
    provider: gemini
    display_name: "Gemini 3.5 Flash Lite"
    params: { temperature: 0.2, max_tokens: 8192 }

output:
  games_dir: "games"
